name: Play the game

# Only when something in the game or the tests changes: not for docs only or the Android app.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE", "CNAME", ".vscode/**", ".github/ISSUE_TEMPLATE/**", ".github/pull_request_template.md", ".github/FUNDING.yml", ".github/workflows/agent-*.yml", ".github/workflows/claude.yml", ".github/workflows/setup-labels.yml", ".github/workflows/google-tv.yml", ".github/workflows/pages.yml", "android-tv/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE", "CNAME", ".vscode/**", ".github/ISSUE_TEMPLATE/**", ".github/pull_request_template.md", ".github/FUNDING.yml", ".github/workflows/agent-*.yml", ".github/workflows/claude.yml", ".github/workflows/setup-labels.yml", ".github/workflows/google-tv.yml", ".github/workflows/pages.yml", "android-tv/**"]
  workflow_dispatch:

jobs:
  play:
    name: Play every day
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Play the game
        run: npx playwright test

      - name: Keep the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
